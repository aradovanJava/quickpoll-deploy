# ============================================================
#  QuickPoll — base configuration
#  Profile-specific overrides live in application-{profile}.properties
# ============================================================

spring.application.name=quickpoll

# Default active profile = dev (H2 in-memory database, zero setup).
# Override at runtime with:
#   --spring.profiles.active=prod
#   SPRING_PROFILES_ACTIVE=prod
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Server
server.port=${PORT:8080}
server.shutdown=graceful

# Thymeleaf — disable caching during demos so template edits are reflected immediately
spring.thymeleaf.cache=false

# JPA — show SQL during the demo so students can see what Spring Data is doing
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Actuator — expose only safe endpoints; used by cloud platforms for health checks
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# Friendly label that shows in the UI footer — overridden per deployment target
quickpoll.deployment.label=local-dev
