# ============================================================
#  prod profile — PostgreSQL via environment variables
#  Used by every cloud platform (Render, Railway, Fly.io, Koyeb,
#  Cloud Run, Beanstalk, App Service, Heroku-style PaaSes).
# ============================================================

# Most PaaSes inject a single DATABASE_URL env variable. We read it directly
# when available, otherwise fall back to discrete SPRING_DATASOURCE_* vars.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/quickpoll}
spring.datasource.username=${DATABASE_USERNAME:quickpoll}
spring.datasource.password=${DATABASE_PASSWORD:quickpoll}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Disable the H2 console in production
spring.h2.console.enabled=false

# Connection pool tuning — modest defaults that work on free-tier RAM budgets
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000

quickpoll.deployment.label=${DEPLOYMENT_LABEL:production}
