# ============================================================
#  docker profile — used inside docker-compose
#  Connects to the 'db' service defined in docker-compose.yml.
# ============================================================

spring.datasource.url=jdbc:postgresql://db:5432/quickpoll
spring.datasource.username=quickpoll
spring.datasource.password=quickpoll
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.h2.console.enabled=false

quickpoll.deployment.label=docker-compose
