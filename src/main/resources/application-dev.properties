# ============================================================
#  dev profile — H2 in-memory database
#  Activated automatically when no other profile is set.
#  Data is lost on every restart. Perfect for IntelliJ demos.
# ============================================================

spring.datasource.url=jdbc:h2:mem:quickpoll;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# H2 web console available at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

quickpoll.deployment.label=local-dev (H2)
