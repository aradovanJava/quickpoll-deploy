name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build executable JAR
        run: mvn -B clean package

      - name: Build WAR for Tomcat
        run: mvn -B clean package -Pwar

      - name: Run tests
        run: mvn -B test

      - name: Build Docker image
        run: docker build -t quickpoll:${{ github.sha }} .
