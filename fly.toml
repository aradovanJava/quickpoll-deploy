# ============================================================
#  Fly.io app config
#  After installing flyctl and running 'fly launch', this file
#  is what Fly looks at to deploy.
# ============================================================

app = "quickpoll"
primary_region = "fra"          # Frankfurt — closest free region to Zagreb

[build]

[env]
  SPRING_PROFILES_ACTIVE = "prod"
  DEPLOYMENT_LABEL = "fly.io"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"   # scale to zero when idle
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    method = "GET"
    timeout = "5s"
    path = "/actuator/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpus = 1
